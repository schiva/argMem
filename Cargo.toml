[package]
name = "argmem"
version = "0.1.2"
edition = "2021"
description = "자주 쓰는 명령 파라미터를 기억해 PowerShell / cmd 에서 자동 입력"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "z"
lto = true
strip = true
