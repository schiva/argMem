name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5

      - name: Check version and changelog
        run: |
          $tag = "${{ github.ref_name }}"
          $ver = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"(.+)"').Matches[0].Groups[1].Value
          if ("v$ver" -ne $tag) { throw "tag $tag != Cargo.toml v$ver" }
          ./installer/changelog-section.ps1 -Version $ver | Out-Null

      - name: Test
        run: cargo test --locked

      - name: Build
        run: cargo build --release --locked

      - name: Package
        run: |
          $tag = "${{ github.ref_name }}"
          New-Item -ItemType Directory dist | Out-Null
          $pkg = "dist/argmem-$tag-windows-x64"
          New-Item -ItemType Directory $pkg | Out-Null
          Copy-Item target/release/argmem.exe, installer/install.ps1, installer/install.cmd, README.md, README.en.md, CHANGELOG.md $pkg
          Compress-Archive -Path "$pkg/*" -DestinationPath "$pkg.zip"
          Remove-Item -Recurse $pkg
          Copy-Item target/release/argmem.exe, installer/install.ps1 dist
          Push-Location dist
          Get-ChildItem -File | ForEach-Object {
            "{0}  {1}" -f (Get-FileHash -Algorithm SHA256 $_.Name).Hash.ToLower(), $_.Name
          } | Set-Content -Encoding ascii SHA256SUMS.txt
          Pop-Location
          Get-ChildItem dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          ./installer/release-notes.ps1 -Tag $tag -Repo "${{ github.repository }}" | Set-Content -Encoding utf8 notes.md
          Get-Content notes.md
          gh release create $tag (Get-ChildItem dist -File).FullName --title "argmem $tag" --notes-file notes.md
