name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5

      - name: Check tag matches Cargo.toml version
        run: |
          $ver = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"(.+)"').Matches[0].Groups[1].Value
          if ("v$ver" -ne "${{ github.ref_name }}") { throw "tag ${{ github.ref_name }} != Cargo.toml v$ver" }

      - name: Test
        run: cargo test --locked

      - name: Build
        run: cargo build --release --locked

      - name: Package
        run: |
          $tag = "${{ github.ref_name }}"
          New-Item -ItemType Directory dist | Out-Null
          $pkg = "dist/argmem-$tag-windows-x64"
          New-Item -ItemType Directory $pkg | Out-Null
          Copy-Item target/release/argmem.exe, installer/install.ps1, installer/install.cmd, README.md $pkg
          Compress-Archive -Path "$pkg/*" -DestinationPath "$pkg.zip"
          Remove-Item -Recurse $pkg
          Copy-Item target/release/argmem.exe, installer/install.ps1 dist
          Push-Location dist
          Get-ChildItem -File | ForEach-Object {
            "{0}  {1}" -f (Get-FileHash -Algorithm SHA256 $_.Name).Hash.ToLower(), $_.Name
          } | Set-Content -Encoding ascii SHA256SUMS.txt
          Pop-Location
          Get-ChildItem dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $notes = @"
          ## 설치

          PowerShell 에서:

          ``````powershell
          irm https://github.com/${{ github.repository }}/releases/download/$tag/install.ps1 | iex
          ``````

          또는 ``argmem-$tag-windows-x64.zip`` 을 받아 압축을 풀고 ``install.cmd`` 를 더블클릭하세요.

          제거: ``& ([scriptblock]::Create((irm https://github.com/${{ github.repository }}/releases/latest/download/install.ps1))) -Uninstall``
          "@
          gh release create $tag (Get-ChildItem dist -File).FullName --title "argmem $tag" --notes $notes
